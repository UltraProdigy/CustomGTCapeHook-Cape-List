name: Cape Request

on:
  issues:
    types: [opened]

permissions: {}

jobs:
  process:
    if: startsWith(github.event.issue.title, 'Cape Request')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
      issues: write
      pull-requests: write
    steps:
      - name: Check out trusted automation
        uses: actions/checkout@v6
        with:
          ref: master
          persist-credentials: false
      - name: Process cape request
        uses: actions/github-script@v8
        with:
          script: |
            const { run } = require('./.github/scripts/cape-request.cjs');
            await run({ github, context, core });
