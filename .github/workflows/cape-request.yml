name: Cape request

on:
  issues:
    types: [opened, edited, reopened]
  workflow_dispatch:
    inputs:
      issue_number:
        description: Open cape request issue number to retry
        required: true
        type: string

permissions: {}

# Serialize edits to one issue. Different requests can run independently, while
# their UUID-based branches prevent duplicate PRs for the same Minecraft account.
concurrency:
  group: cape-request-${{ github.event.issue.number || inputs.issue_number }}
  cancel-in-progress: false

jobs:
  process:
    if: github.event_name == 'workflow_dispatch' || startsWith(github.event.issue.title, '[Cape Request]:')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
      issues: write
      pull-requests: write
    steps:
      - name: Check out trusted automation
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: master
          persist-credentials: false
      - name: Process cape request
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        env:
          REQUEST_ISSUE_NUMBER: ${{ github.event.issue.number || inputs.issue_number }}
        with:
          script: |
            const { run } = require('./.github/scripts/cape-request.cjs');
            await run({
              github, context, core,
              issueNumber: Number(process.env.REQUEST_ISSUE_NUMBER),
            });
